[package]
name = "pricing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
libm = "0.2"
thiserror.workspace = true
serde = { workspace = true, optional = true }
# Generates the TypeScript binding for `Greeks` and `OptionType`, which cross the API
# embedded in `portfolio::PositionRisk`. See Part 14's notes for why bindings are
# generated rather than hand-written.
ts-rs.workspace = true

[features]
# Serde derives for the plain enums. `BsInputs` is deliberately not deserialisable,
# because that would bypass validation.
serde = ["dep:serde"]

[dev-dependencies]
approx.workspace = true
# Benchmarks only. No default features: no plotting or HTML reports, which keeps the tree small.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest.workspace = true

[[bench]]
name = "greeks"
harness = false

[[bench]]
name = "implied_vol"
harness = false
