# cargo-deny configuration (Part 24). Run `cargo deny check` locally; nothing here installs it.
# Only permissive licences are allowed. A copyleft dependency fails the check.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the check. A finding that cannot be
# fixed is listed under `ignore` below with a reason, never silenced without one.
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies on this workspace's own crates carry no version, so they are allowed.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
