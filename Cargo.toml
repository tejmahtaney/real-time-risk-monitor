[workspace]
resolver = "3"
members = [
    "crates/pricing",
    "crates/domain",
    "crates/storage",
    "crates/portfolio",
    "crates/marketdata",
    "crates/risk",
    "crates/engine",
    "crates/server",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates. Direction is documented in CLAUDE.md.
pricing = { path = "crates/pricing" }
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
portfolio = { path = "crates/portfolio" }
marketdata = { path = "crates/marketdata" }
risk = { path = "crates/risk" }
engine = { path = "crates/engine" }

# Shared external crates.
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
csv = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
toml = "1"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"
rand_distr = { version = "0.6", default-features = false }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit", "fs"] }
figment = { version = "0.10", features = ["toml", "env"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
anyhow = "1"

# Dev crates.
approx = "0.5"
proptest = "1"
tempfile = "3"
wiremock = "0.6"
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TypeScript binding generation for the API's wire types (Part 14), so the frontend's
# types can never silently drift from the Rust structs actually sent over the wire.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise for numeric code.
cast_precision_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
