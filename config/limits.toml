# Risk limits (Part 10). Utilisation = |value| / limit, except the theta floor, which
# compares against the day's decay cost, max(0, -theta). Tuned by
# `cargo run -p engine --example tune_limits` against 10 headless sessions of seed 42
# over the sample portfolio; see docs/PROGRESS.md Part 10 for the distributions and the
# reasoning behind these numbers.

# Utilisation at or above this fraction of a limit is a warning.
warning_threshold = 0.8
# Once a limit reaches Warning or above, it stays there until utilisation drops below
# this fraction, so a value that hovers around the warning line does not flap in and out
# of Warning.
warning_clear_threshold = 0.75
# Once breached, a limit clears only when utilisation drops below this fraction, so a
# value that hovers around the breach line does not flap in and out of Breach.
clear_threshold = 0.95

# 99 % one-day Value at Risk (headline method, config/risk.toml's headline_var_method).
# Evaluated from Part 18 onwards. `tune_limits` (rerun with a real VarCalculator, not a
# placeholder) measured the headline VaR99 across 10 seed-42 sessions at min 5,886, p50
# 15,163, p90 21,236, p99 24,475, max 24,986. Set to about 30 % above that observed peak:
# a reserved ceiling in the same spirit as dollar_gamma_1pct, vega and gross_exposure
# (quiet on this sample book, a real limit for a bigger move), not a demo trigger like
# dollar_delta or the TSLA override below.
var_99 = 32500

[portfolio]
# Directional exposure: the dollar P&L of a 1 % move in every underlying together. The
# sample book's static stock (500 SPY, 300 AAPL) alone carries about $490,000 of dollar
# delta, so this limit is deliberately tight: it is in breach from the open of every
# session and never clears, the demo's one permanent headline alert.
dollar_delta = 550000
# Hedging cost in a fast market: how fast dollar delta itself moves on a 1 % move. Set
# above the observed session peak (about 6,500), reserved for a real gamma spike.
dollar_gamma_1pct = 9500
# Exposure to implied vol moves, in dollars per vol point. Set above the observed peak
# (about 1,550).
vega = 2200
# Daily time decay the book pays. Compared against max(0, -theta), so positive theta
# never breaches this. Set above the spike seen when spy-call-expiring settles (about
# 3,000), reserved for a bigger decay day.
theta_floor = 4500
# Total gross exposure, Σ|dollar delta| over underlyings. Set above the observed peak
# (about 1,930,000).
gross_exposure = 2700000
# Concentration: the largest single underlying's share of gross exposure. SPY runs
# 32-42 % of this book's exposure; set above that band.
max_concentration = 0.55

# Per-underlying |dollar delta|, with a default and optional per-symbol overrides. The
# default covers AAPL and NVDA, whose peaks stay under 90,000. MSFT and SPY carry much
# larger positions (a straddle and a stock-plus-option book) and need a higher ceiling of
# their own. TSLA gets the demo's dynamic limit: its bull call spread's dollar delta
# swings between roughly $48,000 and $111,000 a session as spot moves relative to the two
# strikes, so a $74,000 ceiling is crossed and cleared several times a session (found by
# `tune_limits`'s grid search: every one of the 10 tuning sessions lands 1-3 entries into
# Warning or Breach, most with at least one clear back to Ok).
[underlying_dollar_delta]
default = 150000
[underlying_dollar_delta.overrides]
MSFT = 500000
SPY = 1000000
TSLA = 74000
