# Value-at-Risk configuration (Part 18). headline_var_method selects which of the three
# VaR methods' VaR99 the dashboard shows as its headline figure and is compared against
# config/limits.toml's var_99 limit. One of "delta_normal", "delta_gamma_mc",
# "historical". delta_gamma_mc is the default: the only one of the three that prices
# both delta and gamma risk without depending on a single 99-point historical window.
headline_var_method = "delta_gamma_mc"
